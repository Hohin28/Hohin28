<svg viewBox="0 0 1180 745" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#00B4D8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#00F5D4" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="objectBoundingBox">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <g filter="url(#cardShadow)">
    <rect x="3" y="3" width="1174" height="739" rx="16" fill="#0D1117" fill-opacity="0.94" stroke="#FFFFFF14" stroke-width="1"/>
  </g>
  <rect x="3" y="3" width="1174" height="739" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="1" stroke-opacity="0.28"/>

  <circle cx="30" cy="29" r="5.5" fill="#FF5F56"/>
  <circle cx="48" cy="29" r="5.5" fill="#FFBD2E"/>
  <circle cx="66" cy="29" r="5.5" fill="#27C93F"/>
  <text x="1156" y="33" text-anchor="end" font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="12.5" fill="#94A3B8">$ ls projects/</text>
  <line x1="1" y1="50" x2="1179" y2="50" stroke="#FFFFFF14" stroke-width="1"/>

<text x="28" y="90" font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="13" fill="#94A3B8">01</text>
<text x="62" y="90" font-family="-apple-system,'Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#00F5D4">CHRONOSLICE</text>
<text x="62" y="113" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#F8FAFC">Per-packet 5G network-slice SLA monitor. Standard NWDAF slice metrics average over a time window and</text>
<text x="62" y="134" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#F8FAFC">hide short severe violations; CHRONOSLICE flags per-packet breaches and attributes each to the</text>
<text x="62" y="155" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#F8FAFC">responsible domain (RAN, transport, or core). Validated with a Python / ns-3 (5G-LENA) simulation;</text>
<text x="62" y="176" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#F8FAFC">in progress toward an IEEE conference submission.</text>
<line x1="28" y1="205" x2="1152" y2="205" stroke="#FFFFFF14" stroke-width="1"/>
<text x="28" y="215" font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="13" fill="#94A3B8">02</text>
<text x="62" y="215" font-family="-apple-system,'Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#00F5D4">Quadtree WSI Navigation Pipeline</text>
<text x="62" y="238" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#F8FAFC">Multi-resolution navigation pipeline for gigapixel pathology slides. Extracts tiles across four</text>
<text x="62" y="259" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#F8FAFC">magnification levels and builds a depth-6 quadtree (1,024 leaf nodes) over a cervical cytology</text>
<text x="62" y="280" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#F8FAFC">slide, with verified coordinate-mapped navigation — foundational infrastructure for downstream</text>
<text x="62" y="301" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#F8FAFC">ResNet / CLAM attention modeling.</text>
<line x1="28" y1="330" x2="1152" y2="330" stroke="#FFFFFF14" stroke-width="1"/>
<text x="28" y="340" font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="13" fill="#94A3B8">03</text>
<text x="62" y="340" font-family="-apple-system,'Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#00F5D4">AEGIS — UPI Mule Account Detection</text>
<text x="62" y="363" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#F8FAFC">AI-driven fraud platform built for a national hackathon. A “Mule DNA” engine profiles account</text>
<text x="62" y="384" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#F8FAFC">behavior across a 3,924-feature dataset, layered with temporal lifecycle intelligence and fraud-</text>
<text x="62" y="405" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#F8FAFC">chain / propagation modeling to flag mule networks before cash-out.</text>
<line x1="28" y1="434" x2="1152" y2="434" stroke="#FFFFFF14" stroke-width="1"/>
<text x="28" y="444" font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="13" fill="#94A3B8">04</text>
<text x="62" y="444" font-family="-apple-system,'Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#00F5D4">CBAC Handwritten Form OCR</text>
<text x="62" y="467" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#F8FAFC">Digitizes handwritten rural health screening forms with IIT Jammu collaborators. Fine-tunes a CTC-</text>
<text x="62" y="488" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#F8FAFC">loss handwritten text recognition model against hand-labeled ground truth across 88 patient folders</text>
<text x="62" y="509" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#F8FAFC">× 13 fields each.</text>
<line x1="28" y1="538" x2="1152" y2="538" stroke="#FFFFFF14" stroke-width="1"/>
<text x="28" y="548" font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="13" fill="#94A3B8">05</text>
<text x="62" y="548" font-family="-apple-system,'Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#00F5D4">Campus Gate</text>
<text x="62" y="571" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#F8FAFC">Vehicle entry/exit management prototype for an academic paper. FastAPI + SQLite backend with EasyOCR</text>
<text x="62" y="592" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#F8FAFC">license-plate recognition and JWT-secured auth, paired with a mobile-first frontend.</text>
<line x1="28" y1="621" x2="1152" y2="621" stroke="#FFFFFF14" stroke-width="1"/>
<text x="28" y="631" font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="13" fill="#94A3B8">06</text>
<text x="62" y="631" font-family="-apple-system,'Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#00F5D4">YOLOv8 Crowd Counter</text>
<text x="62" y="654" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#F8FAFC">Streamlit app for real-time crowd counting. Uses YOLOv8 detection with SAHI tiled inference for</text>
<text x="62" y="675" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#F8FAFC">small or distant subjects, tuned containment-check and confidence-floor logic, and face-body merge</text>
<text x="62" y="696" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#F8FAFC">deduplication — targeting 90%+ accuracy.</text>
</svg>
